{% extends "layout.html" %}

{% block title %}Error{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card error-card">
        <div class="error-icon">⚠️</div>
        <h1>Error</h1>
        <p class="error-message">{{ error }}</p>
        <a href="{{ url_for('dashboard') if session.username else url_for('login') }}" class="btn btn-primary">
            Go Back
        </a>
    </div>
</div>
{% endblock %}
